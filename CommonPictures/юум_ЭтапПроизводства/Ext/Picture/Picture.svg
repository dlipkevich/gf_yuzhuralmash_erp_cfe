<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100" height="100">
  <!-- 1-я иконка: Три линии (лево-центр-право) -->
  <g fill="#555555">
    <!-- Верхняя линия (прижата влево, длина ровно половина) -->
    <rect x="3" y="4" width="9" height="2.5" rx="1" />
    
    <!-- Средняя линия (по центру, чуть короче, чем было) -->
    <rect x="6" y="10.75" width="12" height="2.5" rx="1" />
    
    <!-- Нижняя линия (прижата вправо, длина как у верхней) -->
    <rect x="12" y="17.5" width="9" height="2.5" rx="1" />
  </g>
</svg>